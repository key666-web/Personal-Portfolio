<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><rect width="900" height="1100" fill="#f7f4ee"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111}.muted{fill:#6e7069}.blue{fill:#3157ff}.title{font-size:58px;font-weight:800;letter-spacing:-1px}.sub{font-size:23px}.card{fill:#fff;stroke:#d7d5ce;stroke-width:2}.h{font-size:28px;font-weight:800}.b{font-size:20px}.k{font-size:16px;font-weight:800;letter-spacing:2px}</style><text x="58" y="82" class="k blue">GODIVA UK · MARKET ANALYSIS</text><text x="58" y="155" class="title">PEST 分析</text><text x="58" y="198" class="sub muted">英国高端巧克力市场的宏观环境</text><rect x="58" y="245" width="372" height="338" rx="24" class="card"/><text x="88" y="298" class="h">P｜政策</text><text x="88" y="345" class="b"><tspan x="88" dy="0">• 塑料包装税提高包装合规与成本要求</tspan><tspan x="88" dy="38">• PPWR 推动更高的可持续包装标准</tspan><tspan x="88" dy="38">• 西非供应不稳定推高可可原料风险</tspan></text><rect x="470" y="245" width="372" height="338" rx="24" class="card"/><text x="500" y="298" class="h">E｜经济</text><text x="500" y="345" class="b"><tspan x="500" dy="0">• 生活成本压力影响非必要消费</tspan><tspan x="500" dy="38">• 通胀挤压消费者可支配收入</tspan><tspan x="500" dy="38">• 可可价格波动增加品牌成本压力</tspan></text><rect x="58" y="621" width="372" height="338" rx="24" class="card"/><text x="88" y="674" class="h">S｜社会</text><text x="88" y="721" class="b"><tspan x="88" dy="0">• 英国巧克力消费习惯保持较高水平</tspan><tspan x="88" dy="38">• 巧克力兼具犒赏、礼赠与情绪属性</tspan><tspan x="88" dy="38">• 高收入人群更重视体验与品牌故事</tspan></text><rect x="470" y="621" width="372" height="338" rx="24" class="card"/><text x="500" y="674" class="h">T｜技术</text><text x="500" y="721" class="b"><tspan x="500" dy="0">• AI 与数据支持产品与配方创新</tspan><tspan x="500" dy="38">• 3D 打印提升造型与差异化体验</tspan><tspan x="500" dy="38">• 数字渠道影响高端体验传递</tspan></text><text x="58" y="1040" class="muted" font-size="16">基于原课程分析提取、翻译并重构用于作品集展示</text></svg>