<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><rect width="900" height="1100" fill="#f7f4ee"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111}.muted{fill:#6e7069}.blue{fill:#3157ff}.title{font-size:58px;font-weight:800;letter-spacing:-1px}.sub{font-size:23px}.card{fill:#fff;stroke:#d7d5ce;stroke-width:2}.h{font-size:28px;font-weight:800}.b{font-size:20px}.k{font-size:16px;font-weight:800;letter-spacing:2px}</style><text x="58" y="82" class="k blue">GODIVA UK · BRAND DIAGNOSIS</text><text x="58" y="155" class="title">SWOT 分析</text><text x="58" y="198" class="sub muted">基于英国市场现状的品牌诊断</text><rect x="58" y="245" width="372" height="338" rx="24" class="card"/><text x="88" y="298" class="h">S｜优势</text><text x="88" y="345" class="b"><tspan x="88" dy="0">• 全球高端品牌认知与品质基础较强</tspan><tspan x="88" dy="38">• 比利时工艺与礼赠属性清晰</tspan><tspan x="88" dy="38">• 持续推出口味与产品创新</tspan></text><rect x="470" y="245" width="372" height="338" rx="24" class="card"/><text x="500" y="298" class="h">W｜劣势</text><text x="500" y="345" class="b"><tspan x="500" dy="0">• 英国客服与物流体验不稳定</tspan><tspan x="500" dy="38">• 零售存在感与渠道覆盖偏弱</tspan><tspan x="500" dy="38">• 营销本地化与文化连接不足</tspan></text><rect x="58" y="621" width="372" height="338" rx="24" class="card"/><text x="88" y="674" class="h">O｜机会</text><text x="88" y="721" class="b"><tspan x="88" dy="0">• 3D 打印支持差异化产品创新</tspan><tspan x="88" dy="38">• 礼赠与沉浸式体验丰富本地产品</tspan><tspan x="88" dy="38">• 健康与可持续趋势带来新品机会</tspan></text><rect x="470" y="621" width="372" height="338" rx="24" class="card"/><text x="500" y="674" class="h">T｜威胁</text><text x="500" y="721" class="b"><tspan x="500" dy="0">• 通胀可能压缩高端消费支出</tspan><tspan x="500" dy="38">• 本地偏好不匹配会削弱亲和力</tspan><tspan x="500" dy="38">• Lindt、Hotel Chocolat 本地优势更强</tspan></text><text x="58" y="1040" class="muted" font-size="16">基于原课程分析提取、翻译并重构用于作品集展示</text></svg>