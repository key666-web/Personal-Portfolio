name: Rename portfolio heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage section heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section class="sec s" id="work"><div class="head"><span>精选项目</span><h2>精选项目</h2></div>'
          new = '<section class="sec s" id="work"><div class="head"><span>作品集</span><h2>作品集</h2></div>'
          if old not in s:
              raise SystemExit('Homepage selected-projects heading not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename homepage section to 作品集"
          git push
