name: Build true black and white GODIVA funnel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign GODIVA journey as a real funnel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'id="cg"' in s, 'GODIVA case #cg not found'
          assert all(x in s for x in ['品牌可见度不足','本地相关性不足','高端体验不一致']), 'GODIVA journey section not found'

          for v in ('V1','V2','V3'):
              s = re.sub(r'/\* GODIVA_JOURNEY_FUNNEL_' + v + r' \*/.*?/\* END_GODIVA_JOURNEY_FUNNEL_' + v + r' \*/', '', s, flags=re.S)
              s = re.sub(r'<!-- GODIVA_JOURNEY_FUNNEL_' + v + r' -->.*?<!-- END_GODIVA_JOURNEY_FUNNEL_' + v + r' -->', '', s, flags=re.S)

          css = "\n".join([
            '/* GODIVA_JOURNEY_FUNNEL_V3 */',
            '#cg .godiva-journey-block .lay{grid-template-columns:1fr;gap:0}',
            '#cg .godiva-journey-block .lab{display:none}',
            '#cg .godiva-journey-block .ct{width:100%}',
            '#cg .godiva-journey-block .ct h2{margin-bottom:34px;max-width:none}',
            '#cg .journey-funnel-v3{display:grid;grid-template-columns:minmax(420px,.98fr) minmax(320px,.82fr);gap:54px;align-items:start;max-width:980px}',
            '#cg .funnel-v3{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;padding:2px 0}',
            '#cg .fv-stage{position:relative;height:88px;color:#111;display:flex;align-items:center;justify-content:center;text-align:center}',
            '#cg .fv-stage:nth-child(1){width:100%}',
            '#cg .fv-stage:nth-child(2){width:84%}',
            '#cg .fv-stage:nth-child(3){width:68%}',
            '#cg .fv-stage:nth-child(4){width:52%}',
            '#cg .fv-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}',
            '#cg .fv-stage path{fill:#fff;stroke:#111;stroke-width:1.25;vector-effect:non-scaling-stroke}',
            '#cg .fv-copy{position:relative;z-index:2;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center}',
            '#cg .fv-kicker{font-size:10px;line-height:1.25;color:#111;margin-bottom:6px;letter-spacing:.02em}',
            '#cg .fv-issue{font-size:17px;line-height:1.22;font-weight:700;letter-spacing:-.025em;color:#111}',
            '#cg .fv-solutions{display:grid;grid-template-rows:repeat(4,88px);gap:10px;padding-top:2px}',
            '#cg .fv-solution{position:relative;display:flex;align-items:center;padding-left:66px;color:#111}',
            '#cg .fv-solution:before{content:"";position:absolute;left:0;top:50%;width:46px;border-top:1px solid #111}',
            '#cg .fv-solution:after{content:"";position:absolute;left:45px;top:calc(50% - 2px);width:5px;height:5px;border:1px solid #111;background:#fff;border-radius:50%}',
            '#cg .fv-solution strong{display:block;font-size:15px;line-height:1.2;color:#111;margin-bottom:5px;letter-spacing:-.015em}',
            '#cg .fv-solution p{margin:0!important;color:#111!important;font-size:11.5px!important;line-height:1.4!important;max-width:260px!important}',
            '@media(max-width:820px){#cg .journey-funnel-v3{grid-template-columns:1fr;gap:26px;max-width:640px}#cg .fv-solutions{grid-template-rows:none;gap:12px}#cg .fv-solution{min-height:58px;padding-left:54px}#cg .fv-solution:before{width:36px}#cg .fv-solution:after{left:35px}}',
            '@media(max-width:520px){#cg .godiva-journey-block .ct h2{margin-bottom:26px}#cg .journey-funnel-v3{grid-template-columns:minmax(0,1fr)}#cg .fv-stage{height:80px}#cg .fv-stage:nth-child(2){width:88%}#cg .fv-stage:nth-child(3){width:76%}#cg .fv-stage:nth-child(4){width:64%}#cg .fv-copy{padding:0 12px}#cg .fv-issue{font-size:15px}#cg .fv-kicker{font-size:9px}}',
            '/* END_GODIVA_JOURNEY_FUNNEL_V3 */'
          ]) + "\n"
          s = s.replace('</style>', css + '</style>', 1)

          js = "\n".join([
            '<!-- GODIVA_JOURNEY_FUNNEL_V3 -->',
            '<script>',
            '(()=>{',
            "const root=document.getElementById('cg');if(!root)return;",
            "const target=[...root.querySelectorAll('.ct')].find(el=>el.textContent.includes('品牌可见度不足')&&el.textContent.includes('本地相关性不足')&&el.textContent.includes('高端体验不一致'));if(!target)return;",
            "const block=target.closest('.block');if(block)block.classList.add('godiva-journey-block');",
            "const shape='<svg viewBox=\"0 0 520 88\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M18 7 Q260 -2 502 7 L470 79 Q260 89 50 79 Z\"/></svg>';",
            "target.innerHTML='<h2>消费者旅程困境</h2><div class=\"journey-funnel-v3\" aria-label=\"GODIVA 消费者旅程困境与对应解决方案\"><div class=\"funnel-v3\"><div class=\"fv-stage\">'+shape+'<div class=\"fv-copy\"><span class=\"fv-kicker\">认知 / 兴趣</span><strong class=\"fv-issue\">品牌可见度不足</strong></div></div><div class=\"fv-stage\">'+shape+'<div class=\"fv-copy\"><span class=\"fv-kicker\">考虑</span><strong class=\"fv-issue\">本地相关性不足</strong></div></div><div class=\"fv-stage\">'+shape+'<div class=\"fv-copy\"><span class=\"fv-kicker\">购买 / 履约</span><strong class=\"fv-issue\">高端体验不一致</strong></div></div><div class=\"fv-stage\">'+shape+'<div class=\"fv-copy\"><span class=\"fv-kicker\">复购 / 留存</span><strong class=\"fv-issue\">负面体验影响复购</strong></div></div></div><div class=\"fv-solutions\" aria-label=\"对应解决方案\"><div class=\"fv-solution\"><div><strong>提升品牌曝光</strong><p>强化搜索与社媒触点</p></div></div><div class=\"fv-solution\"><div><strong>建立本地关联</strong><p>以本地化内容连接英国消费场景</p></div></div><div class=\"fv-solution\"><div><strong>修复消费体验</strong><p>优化包装、配送与客服</p></div></div><div class=\"fv-solution\"><div><strong>强化客户关系</strong><p>售后跟进与复购运营</p></div></div></div></div>';",
            '})();',
            '</script>',
            '<!-- END_GODIVA_JOURNEY_FUNNEL_V3 -->'
          ]) + "\n"
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit GODIVA funnel redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign GODIVA journey as true funnel"
          git push
