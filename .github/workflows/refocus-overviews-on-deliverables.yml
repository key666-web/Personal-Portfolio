name: Build compact HM data charts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HM data section
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit HM data chart update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify H&M data into compact charts"
          git push
