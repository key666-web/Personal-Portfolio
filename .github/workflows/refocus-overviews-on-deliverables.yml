name: Remove GODIVA campaign visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove GODIVA campaign visual block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the GODIVA campaign visual that appears between the case header and tabs.
          s = re.sub(
              r'<!-- GODIVA_VISUAL_START -->.*?<!-- GODIVA_VISUAL_END -->',
              '',
              s,
              flags=re.S
          )

          # Remove CSS that only served that visual.
          s = re.sub(r'\.campaign-preview\{.*?@media\(max-width:720px\)\{\.campaign-inner.*?\}\}', '', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove GODIVA campaign visual"
          git push
