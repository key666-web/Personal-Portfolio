name: Fix opportunity matrix labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make matrix labels upright and aligned
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''/* AI_OPPORTUNITY_MATRIX_LABEL_FIX */
          #ca #a6 .opp-matrix{grid-template-columns:92px 1fr 1fr!important}
          #ca #a6 .opp-head{display:flex;align-items:center;justify-content:center}
          #ca #a6 .opp-head:after{content:"任务价值 ↑";font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--m);white-space:nowrap}
          #ca #a6 .opp-row{writing-mode:horizontal-tb!important;transform:none!important;letter-spacing:0!important;white-space:nowrap;text-align:center;justify-content:center!important;align-items:center!important;font-size:11px!important}
          #ca #a6 .opp-y{display:none!important}
          #ca #a6 .opp-x{left:calc(92px + 50%)!important}
          @media(max-width:720px){#ca #a6 .opp-matrix{grid-template-columns:66px 1fr 1fr!important}#ca #a6 .opp-row{font-size:10px!important}#ca #a6 .opp-head:after{font-size:9px}#ca #a6 .opp-x{left:calc(66px + 50%)!important}}
          '''
          if '/* AI_OPPORTUNITY_MATRIX_LABEL_FIX */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix AI opportunity matrix label orientation"
          git push
