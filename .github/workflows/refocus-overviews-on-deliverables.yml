name: Fix inline question typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix oversized inline labels inside cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '/* INLINE_LABEL_FIX_V1 */.case .box p b{display:inline!important;font-size:inherit!important;line-height:inherit!important;letter-spacing:0!important;margin:0!important;font-weight:800!important;color:inherit!important}'
          if '/* INLINE_LABEL_FIX_V1 */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix oversized key question labels"
          git push
