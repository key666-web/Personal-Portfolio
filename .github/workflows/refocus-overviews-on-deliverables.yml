name: Fix H&M visual asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch H&M visual reference to WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/hm-uniqlo-growth.svg','assets/hm-uniqlo-growth.webp')
          s = s.replace('assets/hm-uniqlo-growth.jpg','assets/hm-uniqlo-growth.webp')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point H&M visual to WebP asset"
          git push
# retrigger after binary asset repair
