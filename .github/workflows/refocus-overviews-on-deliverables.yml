name: Reduce repeated portfolio text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify case copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Remove repeated conclusion/callout blocks. Section headings and evidence stay.
          s = re.sub(r'<div class="ins(?: key)?">.*?</div>', '', s, flags=re.S)
          s = re.sub(r'<div class="final">.*?</div>', '', s, flags=re.S)

          # 2) When a section already has visual evidence/cards, remove the extra explanatory paragraph under the heading.
          rich = r'(?:grid4|grid3|duo|path|logic-flow|campaign-preview|campaign-board)'
          s = re.sub(
              rf'(<div class="ct"><h2>.*?</h2>)<p>.*?</p>(?=<div class="{rich}")',
              r'\1',
              s,
              flags=re.S
          )

          # 3) Remove the redundant H&M closing section if it still exists; the journey already communicates the conclusion.
          s = s.replace('<a href="#f8">08 策略结论</a>', '')
          m = re.search(r'<div class="block" id="f8">', s)
          if m:
              start = m.start()
              # find the next case section or end of current case
              end_case = s.find('</section>', start)
              if end_case != -1:
                  s = s[:start] + s[end_case:]

          # 4) Remove the small preview disclaimer under GODIVA visual; the visual itself is enough.
          s = re.sub(r'<div class="preview-note">.*?</div>', '', s, flags=re.S)

          # 5) Shorten several repeated explanatory sentences that remain inside cards.
          replacements = {
            '品牌传统清晰，但与英国消费者熟悉的消费场景连接不足。':'品牌资产与英国消费场景连接不足。',
            '现有低评分说明购买后的体验存在风险，但项目没有直接测量留存率。':'低评分提示复购风险。',
            '用英国下午茶这一熟悉场景，把品牌传统转化为更容易理解和记住的本地价值。':'用英式下午茶建立本地相关性。',
            '改善包装、配送、订单追踪、客服与补偿机制，让实际体验重新匹配高端定位。':'改善包装、配送、追踪与客服体验。',
            '把 StyleHint 从穿搭工具进一步转化为“创作者示范 → 用户复刻 → 上传分享”的参与路径。':'StyleHint：创作者示范 → 用户复刻 → 上传分享。',
            '在已有低摩擦购买路径上补强社群参与与情绪激活。':'在低摩擦购买路径上补强参与。',
            '完整的社交商务系统不应停留在互动，而应继续连接购买、履约与长期关系。':'互动 → 购买 → 履约 → 留存。'
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce repeated conclusions and simplify case copy"
          git push
