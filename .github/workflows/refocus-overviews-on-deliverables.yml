name: Clean portfolio helper notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove small explanatory notes while keeping source citations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove small helper/disclaimer notes, but keep actual source citation rows with links.
          pattern = re.compile(r'<div class="src">(.*?)</div>', re.S)
          removed = 0
          def clean(match):
              nonlocal_removed = None
              content = match.group(1)
              if '<a href=' in content:
                  return match.group(0)
              return ''

          before = s
          s = pattern.sub(clean, s)

          # Keep the extension section itself, but remove disclaimer-style wording.
          s = s.replace('作品集延伸：以上两项为基于原课程比较分析进一步形成的策略建议，不作为原课程项目已完成的结论。','')

          if s == before:
              raise SystemExit('No removable helper notes found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean small explanatory notes"
          git push
