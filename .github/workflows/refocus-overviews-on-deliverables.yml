name: "Build compact H&M data charts"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Replace H&M metric cards with compact charts"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'id="cf"' in s, 'H&M case #cf not found'
          assert '69.63' in s and '46.93M' in s, 'H&M data section not found'

          s = re.sub(r'/\* HM_DATA_VIZ_V1 \*/.*?/\* END_HM_DATA_VIZ_V1 \*/', '', s, flags=re.S)
          s = re.sub(r'<!-- HM_DATA_VIZ_V1 -->.*?<!-- END_HM_DATA_VIZ_V1 -->', '', s, flags=re.S)

          css = r'''
/* HM_DATA_VIZ_V1 */
#cf .hm-data-viz-block .ct h2{margin-bottom:24px}
#cf .hm-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
#cf .hm-chart{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;min-height:210px}
#cf .hm-chart-kicker{font-size:9px;letter-spacing:.09em;font-weight:800;color:var(--u);margin-bottom:7px}
#cf .hm-chart h3{font-size:17px;line-height:1.2;letter-spacing:-.025em;margin:0 0 18px}
#cf .hm-row{display:grid;grid-template-columns:64px 1fr 74px;gap:10px;align-items:center;margin:13px 0}
#cf .hm-row b{font-size:11px}
#cf .hm-row strong{font-size:15px;text-align:right;letter-spacing:-.02em}
#cf .hm-track{height:7px;background:#e7e5de;position:relative;overflow:hidden}
#cf .hm-fill{display:block;height:100%;background:#111}
#cf .hm-sub{font-size:9.5px;color:var(--m);margin-top:-6px;margin-bottom:4px;padding-left:74px}
#cf .hm-diverge{position:relative;height:58px;margin:3px 0 8px}
#cf .hm-axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#c9c7c0}
#cf .hm-pos,#cf .hm-neg{position:absolute;height:9px;background:#111}
#cf .hm-pos{left:50%;top:8px;width:43%}
#cf .hm-neg{right:50%;bottom:8px;width:35%}
#cf .hm-div-label{position:absolute;font-size:10px;font-weight:700}
#cf .hm-div-label.hm-l1{left:50%;top:23px;transform:translateX(7px)}
#cf .hm-div-label.hm-l2{right:50%;bottom:23px;transform:translateX(-7px)}
#cf .hm-data-judgements{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#cf .hm-judge{border-top:1px solid #111;padding:14px 2px 0}
#cf .hm-judge span{display:block;font-size:9px;color:var(--u);font-weight:800;letter-spacing:.08em;margin-bottom:6px}
#cf .hm-judge strong{font-size:17px;line-height:1.3;letter-spacing:-.025em}
#cf .hm-data-note{font-size:9.5px;color:var(--m);margin-top:14px}
@media(max-width:820px){#cf .hm-data-grid{grid-template-columns:1fr}#cf .hm-chart{min-height:auto}#cf .hm-data-judgements{grid-template-columns:1fr}}
/* END_HM_DATA_VIZ_V1 */
'''
          s = s.replace('</style>', css + '</style>', 1)

          js = r'''
<!-- HM_DATA_VIZ_V1 -->
<script>
(()=>{
  const root=document.getElementById('cf');if(!root)return;
  const target=[...root.querySelectorAll('.ct')].find(el=>el.textContent.includes('69.63')&&el.textContent.includes('46.93M'));
  if(!target)return;
  const block=target.closest('.block');if(block)block.classList.add('hm-data-viz-block');
  target.innerHTML=`
    <h2>数据对比</h2>
    <div class="hm-data-grid">
      <div class="hm-chart">
        <div class="hm-chart-kicker">SOCIAL ENGAGEMENT</div>
        <h3>TikTok 互动率变化</h3>
        <div class="hm-diverge">
          <span class="hm-axis"></span>
          <span class="hm-pos"></span><span class="hm-neg"></span>
          <span class="hm-div-label hm-l1">H&M +69.63%</span>
          <span class="hm-div-label hm-l2">UNIQLO −56.15%</span>
        </div>
      </div>
      <div class="hm-chart">
        <div class="hm-chart-kicker">SOCIAL REACH</div>
        <h3>Instagram 触达</h3>
        <div class="hm-row"><b>H&M</b><div class="hm-track"><span class="hm-fill" style="width:100%"></span></div><strong>46.93M</strong></div>
        <div class="hm-sub">增长 +120.74%</div>
        <div class="hm-row"><b>UNIQLO</b><div class="hm-track"><span class="hm-fill" style="width:10%"></span></div><strong>4.69M</strong></div>
        <div class="hm-sub">增长 +46.9%</div>
      </div>
      <div class="hm-chart">
        <div class="hm-chart-kicker">SEARCH DISCOVERY</div>
        <h3>非品牌搜索流量</h3>
        <div class="hm-row"><b>H&M</b><div class="hm-track"><span class="hm-fill" style="width:7%"></span></div><strong>18.6K</strong></div>
        <div class="hm-row"><b>UNIQLO</b><div class="hm-track"><span class="hm-fill" style="width:100%"></span></div><strong>257.2K</strong></div>
      </div>
    </div>
    <div class="hm-data-judgements">
      <div class="hm-judge"><span>H&M</span><strong>更擅长制造注意力与参与</strong></div>
      <div class="hm-judge"><span>UNIQLO</span><strong>搜索发现更强，购买路径更清晰</strong></div>
    </div>
    <div class="hm-data-note">项目观察期数据，用于比较两种社媒与搜索模式。</div>`;
})();
</script>
<!-- END_HM_DATA_VIZ_V1 -->
'''
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: "Commit H&M data chart update"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify H&M data into compact charts"
          git push
