name: Fix dark card contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix dark card contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '.case .box.dark{background:#151515!important;color:#fff!important;border-color:#151515!important}.case .box.dark h3,.case .box.dark b{color:#fff!important}.case .box.dark p,.case .box.dark span{color:#c7c7c7!important}.case .box.dark em{background:#2a2a2a!important;color:#aebcff!important}'
          if css not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix dark card text contrast"
          git push
