name: Use actual H&M visual image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace simplified SVG with approved H&M visual
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/hm_growth_00.txt \
            .tmp/hm_growth_01.txt \
            .tmp/hm_growth_02.txt \
            .tmp/hm_growth_03.txt \
            .tmp/hm_growth_04.txt \
            .tmp/hm_growth_05.txt \
            | base64 -d > assets/hm-uniqlo-growth.jpg

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/hm-uniqlo-growth.svg'
          new = 'assets/hm-uniqlo-growth.jpg'
          if old not in s and new not in s:
              raise SystemExit('H&M growth visual reference not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f assets/hm-uniqlo-growth.svg
          rm -f .tmp/hm_growth_00.txt .tmp/hm_growth_01.txt .tmp/hm_growth_02.txt .tmp/hm_growth_03.txt .tmp/hm_growth_04.txt .tmp/hm_growth_05.txt

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- . ':!.github/workflows/refocus-overviews-on-deliverables.yml'; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .tmp
          git commit -m "Use approved H&M growth visual"
          git push
