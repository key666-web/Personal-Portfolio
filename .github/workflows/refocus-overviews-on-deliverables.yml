name: Simplify case overview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify overview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''.project-overview{margin-top:30px;display:grid;grid-template-columns:1fr 1.35fr;gap:10px;max-width:none}.overview-row{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:16px 18px;min-height:96px}.overview-label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--u);margin-bottom:10px}.overview-text{font-size:17px;font-weight:700;color:var(--i);line-height:1.4;letter-spacing:-.015em}.overview-row.result{grid-column:1/-1;background:#151515;border-color:#151515;padding:24px 26px;min-height:auto}.overview-row.result .overview-label{color:#8093ff;margin-bottom:10px}.overview-row.result .overview-text{color:#fff;font-size:14px;font-weight:500}.overview-row.result .overview-text strong{display:block;font-size:clamp(26px,3.2vw,36px);line-height:1.14;letter-spacing:-.04em;margin-bottom:9px}.overview-row.result .overview-text span{display:block;color:#aaa;font-size:13px;line-height:1.5;font-weight:500}@media(max-width:720px){.project-overview{grid-template-columns:1fr}.overview-row{min-height:auto}.overview-row.result{grid-column:1}}'''
          s = s.replace('</style>', css + '</style>', 1)

          cases = {
            'ca': ('消费级 AI 市场机会分析','市场研究 · 竞争分析 · 任务分群 · 机会矩阵','完成消费级 AI 市场机会分析','专业工作流 · 潜在需求 · 个性化互动娱乐'),
            'cg': ('英国市场本地化品牌策略','市场分析 · 旅程诊断 · 本地化策略 · 活动设计','完成 GODIVA UK 本地化品牌方案','GODIVA TEA TIME · 体验修复 · 衡量指标'),
            'cf': ('双品牌社交媒体策略对比','内容对比 · 数据分析 · 平台分工 · 路径优化','完成 H&amp;M × UNIQLO 社媒优化方案','发现 → 考虑 → 转化 → 履约 → 留存'),
            'cr': ('消费者实验研究','实验设计 · 问卷收集 · SPSS · 中介分析','完成 165 份有效样本分析','高质量故事显著提升叙事传输与购买意愿')
          }

          for cid, vals in cases.items():
              sec = s.find(f'<section class="case" id="{cid}">')
              start = s.find('<div class="project-overview">', sec)
              if start < 0:
                  continue
              i = start
              depth = 0
              end = None
              while i < len(s):
                  if s.startswith('<div', i):
                      depth += 1
                      i = s.find('>', i) + 1
                      continue
                  if s.startswith('</div>', i):
                      depth -= 1
                      i += 6
                      if depth == 0:
                          end = i
                          break
                      continue
                  i += 1
              if end is None:
                  continue
              positioning, work, title, sub = vals
              new = '<div class="project-overview">' + \
                    f'<div class="overview-row"><div class="overview-label">项目定位</div><div class="overview-text">{positioning}</div></div>' + \
                    f'<div class="overview-row"><div class="overview-label">完成工作</div><div class="overview-text">{work}</div></div>' + \
                    f'<div class="overview-row result"><div class="overview-label">项目产出</div><div class="overview-text"><strong>{title}</strong><span>{sub}</span></div></div>' + \
                    '</div>'
              s = s[:start] + new + s[end:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify project overview to three blocks"
          git push
