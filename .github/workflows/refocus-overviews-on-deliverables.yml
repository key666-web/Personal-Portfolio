name: Improve case visual hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen visual hierarchy without adding decorative images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(<div class="lab">)\d{2}\s*/\s*', r'\1', s)

          css = textwrap.dedent('''
          /* VISUAL_HIERARCHY_V2 */
          .case{counter-reset:case-step}
          .case .block{counter-increment:case-step;padding:72px 0}
          .case .lay{grid-template-columns:126px 1fr;gap:46px;position:relative}
          .case .lab{position:relative;padding-top:48px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#3f413d;line-height:1.35}
          .case .lab:before{content:counter(case-step,decimal-leading-zero);position:absolute;left:0;top:0;font-size:34px;line-height:1;font-weight:900;letter-spacing:-.05em;color:var(--u)}
          .case .lab:after{content:"";position:absolute;left:0;top:38px;width:34px;height:2px;background:var(--u)}
          .case .ct h2{font-size:clamp(32px,4.2vw,52px);line-height:1.02;max-width:900px;margin-bottom:22px}
          .case .ct>p{font-size:14px;line-height:1.7;max-width:720px;color:#62645f}
          .case .grid4,.case .grid3{gap:12px;margin-top:24px}
          .case .box{min-height:132px;padding:20px;background:#fbfaf6;border-color:#d5d3cb;display:flex;flex-direction:column;justify-content:flex-start}
          .case .box b{font-size:clamp(34px,4vw,48px);line-height:.98;margin-bottom:12px}
          .case .box h3{font-size:18px;line-height:1.2;margin:10px 0 8px}
          .case .box p,.case .box span{font-size:11.5px;line-height:1.55}
          .case .box em{display:inline-flex;width:max-content;max-width:100%;padding:5px 7px;border-radius:7px;background:#e9eeff;color:var(--u);font-size:9px;letter-spacing:.08em}
          .case .path{margin-top:24px;padding:18px;border:1px solid var(--l);border-radius:18px;background:#fbfaf6}
          .case .node{background:#fff;border:1px solid #d8d6cf;padding:13px 15px}
          .case .path i{font-size:17px;font-weight:900;color:var(--u)}
          .case .logic-flow{border-top:0;margin-top:24px}
          .case .logic-step{grid-template-columns:118px 1fr;gap:20px;padding:22px 24px;margin-bottom:10px;border:1px solid var(--l);border-radius:16px;background:#fbfaf6}
          .case .logic-step+.logic-step{border-top:1px solid var(--l)}
          .case .logic-label{padding-top:3px}
          .case .logic-arrow{display:none}
          .case .core-conclusion{background:#151515;color:#fff;border-top:0;padding:64px 0}
          .case .core-conclusion .lab{color:#d0d0d0}
          .case .core-conclusion .lab:before{color:#8093ff}
          .case .core-conclusion .lab:after{background:#8093ff}
          .case .core-conclusion .ct h2{color:#fff;font-size:clamp(38px,5vw,64px);max-width:980px;margin:0}
          .case .project-overview{gap:12px;margin-top:34px}
          .case .overview-row{padding:18px 20px;border-radius:16px}
          .case .overview-row.result{padding:26px 28px}
          .case .overview-row.result .overview-text strong{font-size:clamp(28px,3.4vw,40px)}
          .case .tabs{padding-top:10px;padding-bottom:10px}
          .case .tabs a{transition:.18s;border-color:#d2d0c9;background:#f8f7f2}
          .case .tabs a:hover{border-color:var(--u);color:var(--u)}
          @media(max-width:720px){.case .block{padding:54px 0}.case .lay{grid-template-columns:1fr;gap:18px}.case .lab{padding-top:42px}.case .lab:before{font-size:30px}.case .ct h2{font-size:clamp(30px,9vw,44px)}.case .logic-step{grid-template-columns:1fr;gap:8px;padding:18px}.case .grid4,.case .grid3{gap:9px}.case .box{min-height:auto}}
          ''')

          if '/* VISUAL_HIERARCHY_V2 */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve case visual hierarchy and scanning"
          git push
