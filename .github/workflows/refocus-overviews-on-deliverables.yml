name: Refine H&M case typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refocus-overviews-on-deliverables.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce H&M case title sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''/* HM_TYPOGRAPHY_V1 */
          #cf .ch h1{font-size:clamp(46px,6vw,72px)!important;line-height:.98!important;letter-spacing:-.055em!important}
          #cf .ct h2{font-size:clamp(26px,3vw,38px)!important;line-height:1.10!important;letter-spacing:-.035em!important;max-width:920px}
          #cf .overview-row.result .overview-text strong{font-size:clamp(24px,2.6vw,32px)!important;line-height:1.18!important}
          #cf .box h3{font-size:16px!important;line-height:1.28!important;letter-spacing:-.01em!important}
          @media(max-width:720px){#cf .ch h1{font-size:clamp(40px,12vw,56px)!important}#cf .ct h2{font-size:clamp(24px,7vw,32px)!important}}
          '''
          if '/* HM_TYPOGRAPHY_V1 */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce H&M case title sizes"
          git push
