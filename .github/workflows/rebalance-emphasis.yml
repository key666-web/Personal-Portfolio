name: Rebalance visual emphasis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebalance-emphasis.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance emphasis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '.ins.key{background:#151515;color:#fff;border-left:0;border-radius:16px;padding:18px 20px}.logic-hyp{background:#151515!important;color:#fff!important;border-color:#151515!important}.logic-hyp .logic-label{color:#8093ff}.logic-hyp .logic-body h3,.logic-hyp .logic-body p{color:#fff}.logic-hyp .logic-body p{opacity:.76}'
          if '.ins.key{' not in s:
              marker='@media(max-width:720px)'
              s=s.replace(marker,css+marker,1)

          # Evidence/category cards should remain neutral.
          s=s.replace('<div class="box dark"><em>VALUE SHIFT</em><h3>价值向执行迁移</h3>','<div class="box"><em>VALUE SHIFT</em><h3>价值向执行迁移</h3>')
          s=s.replace('<div class="box dark"><em>VERTICAL AI</em><h3>工作流优势</h3>','<div class="box"><em>VERTICAL AI</em><h3>工作流优势</h3>')
          s=s.replace('<div class="box dark"><em>H&amp;M</em><h3>Trend → Creator → Participation → Conversion</h3>','<div class="box"><em>H&amp;M</em><h3>Trend → Creator → Participation → Conversion</h3>')

          # Make the user's analysis / inference visually dominant.
          key_texts = [
              '核心变化：竞争正在从“谁回答得更好”转向“谁能更完整地把事情做完”。',
              '比“年龄”更有解释力的分群方式，是用户要完成什么任务，以及这个任务值多少钱。',
              'AI 的市场价值不仅来自替代现有工具，也来自扩大原本不可服务的需求边界。',
              '“更垂直”本身不是壁垒；更深的工作流和更直接的结果交付才更接近付费壁垒。',
              '另一个值得关注的机会，是原有门槛很高、但 AI 能显著降低成本并激活的潜在需求。',
              '因此，战略任务不是“让更多人看见 Godiva”，而是让英国消费者重新感受到 Godiva 为什么值得。',
              'H&amp;M wins attention. UNIQLO reduces friction. Neither alone represents a complete social system.',
              'The strongest social strategy does not choose between engagement and conversion. It gives every platform a clear role in the customer journey.'
          ]
          for t in key_texts:
              s=s.replace(f'<div class="ins">{t}</div>',f'<div class="ins key">{t}</div>')

          # Strategic thesis is the key Godiva choice, not the surrounding evidence boxes.
          s=s.replace('<div class="box"><em>STRATEGIC THESIS</em><h3>从品牌传统到本地价值</h3>','<div class="box dark"><em>STRATEGIC THESIS</em><h3>从品牌传统到本地价值</h3>')

          # Dissertation: emphasize interpreted result, not the p-value card.
          s=s.replace('<div class="box"><b>部分中介</b><span>中介类型</span></div>','<div class="box dark"><b>部分中介</b><span>中介类型</span></div>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebalance visual emphasis around analysis and results"
          git push
