name: Restructure case overviews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-case-overviews.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite case overview blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '.project-overview{margin-top:28px;border-top:1px solid var(--l);max-width:920px}.overview-row{display:grid;grid-template-columns:120px 1fr;gap:22px;padding:15px 0;border-bottom:1px solid var(--l)}.overview-label{font-size:11px;font-weight:800;color:var(--i);white-space:nowrap}.overview-text{font-size:13px;color:#555;line-height:1.7}.overview-row.result .overview-label{color:var(--u)}.overview-row.result .overview-text{color:var(--i);font-weight:600}@media(max-width:720px){.overview-row{grid-template-columns:1fr;gap:6px}}'
          if '.project-overview{' not in s:
              marker = '@media(max-width:720px){.logic-step'
              s = s.replace(marker, css + marker, 1)

          cases = {
          'ca': '''<div class="ch s"><div class="k">市场洞察 · 消费者任务 · 机会识别</div><h1>消费者真正愿意<br/>为什么样的 AI 付费？</h1><div class="project-overview"><div class="overview-row"><div class="overview-label">项目背景</div><div class="overview-text">生成式 AI 进入日常使用，通用能力快速免费化。项目希望判断消费级 AI 中哪些任务仍能形成付费价值，以及下一阶段可能出现的增量机会。</div></div><div class="overview-row"><div class="overview-label">项目职责</div><div class="overview-text">独立开展案头研究，整理 QuestMobile、Menlo Ventures、Sensor Tower 及产品公开信息；分析消费者任务、付费逻辑与竞争格局，并构建机会矩阵。</div></div><div class="overview-row"><div class="overview-label">核心需求 / 问题</div><div class="overview-text">当基础能力越来越免费，消费者为什么还要付费？专业 AI 如何建立差异化？哪些需求最值得优先进入？</div></div><div class="overview-row result"><div class="overview-label">项目结果</div><div class="overview-text">形成以任务价值、使用频率、免费替代程度和工作流深度为核心的判断框架；识别专业工作流为当前较清晰的商业化机会，并提出“潜在需求激活”与“个性化互动娱乐”两项延伸判断。</div></div></div></div>''',
          'cg': '''<div class="ch s"><div class="k">品牌策略 · 市场分析 · 本地化营销</div><h1>GODIVA UK</h1><div class="project-overview"><div class="overview-row"><div class="overview-label">项目背景</div><div class="overview-text">GODIVA 拥有全球高端品牌资产，但在英国市场的搜索关注、官网访问、市场份额与消费者评分均偏弱，需要判断问题究竟来自曝光、相关性还是实际体验。</div></div><div class="overview-row"><div class="overview-label">项目职责</div><div class="overview-text">独立梳理市场与竞品信息，分析消费者评价与数字表现，沿消费者旅程诊断关键断点，并形成本地化品牌策略与营销活动方案。</div></div><div class="overview-row"><div class="overview-label">核心需求 / 问题</div><div class="overview-text">如何把全球品牌传统转化为英国消费者能够理解和感知的本地价值，同时修复购买后的高端体验落差？</div></div><div class="overview-row result"><div class="overview-label">项目结果</div><div class="overview-text">形成“修复体验 × 建立本地相关性 × 建立持续关系”的策略框架，提出 GODIVA TEA TIME 核心活动，并设置品牌搜索、消费者评分与市场份额等衡量指标。</div></div></div></div>''',
          'cf': '''<div class="ch s"><div class="k">社交媒体 · 数字策略 · 社交商务</div><h1>H&amp;M × UNIQLO</h1><div class="project-overview"><div class="overview-row"><div class="overview-label">项目背景</div><div class="overview-text">H&amp;M 与 UNIQLO 同时经营 Instagram 和 TikTok，但在互动、触达、内容逻辑与购买路径上呈现明显差异。</div></div><div class="overview-row"><div class="overview-label">项目职责</div><div class="overview-text">对比两品牌的社交媒体内容与数字表现，分析平台角色、消费者旅程和社交商务路径，并基于原分析进一步形成品牌级优化建议。</div></div><div class="overview-row"><div class="overview-label">核心需求 / 问题</div><div class="overview-text">为什么相同平台会产生不同结果？如何在注意力、实用价值、转化与长期关系之间形成更完整的社交媒体系统？</div></div><div class="overview-row result"><div class="overview-label">项目结果</div><div class="overview-text">识别 H&amp;M 强于获得注意力与参与、UNIQLO 强于降低购买摩擦；进一步形成平台分工、线上线下衔接与留存建议，并构建“发现 → 考虑 → 转化 → 履约 → 留存”的社交商务路径。</div></div></div></div>''',
          'cr': '''<div class="ch s"><div class="k">消费者研究 · 数据分析</div><h1>网红故事营销研究</h1><div class="project-overview"><div class="overview-row"><div class="overview-label">项目背景</div><div class="overview-text">现有网红故事营销研究更多比较“有故事 / 无故事”，对故事质量如何影响消费者反应的关注相对不足。</div></div><div class="overview-row"><div class="overview-label">项目职责</div><div class="overview-text">独立设计两组实验与漫画刺激，开展问卷收集与数据清洗，并使用 SPSS 完成信度、组间差异、回归与中介分析。</div></div><div class="overview-row"><div class="overview-label">核心需求 / 问题</div><div class="overview-text">高质量故事是否会提升叙事传输与购买意愿？叙事传输是否在故事质量与购买意愿之间发挥中介作用？</div></div><div class="overview-row result"><div class="overview-label">项目结果</div><div class="overview-text">获得 165 份有效样本；高质量故事显著提升叙事传输与购买意愿；叙事传输发挥部分中介作用，间接效应为 1.462，95% Bootstrap CI [.218, 2.293]。</div></div></div></div>'''
          }

          for cid, new_ch in cases.items():
              sec = f'<section class="case" id="{cid}">'
              start_sec = s.find(sec)
              if start_sec == -1:
                  continue
              start_ch = s.find('<div class="ch s">', start_sec)
              end_ch = s.find('<div class="tabs s">', start_ch)
              if start_ch != -1 and end_ch != -1:
                  s = s[:start_ch] + new_ch + s[end_ch:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Standardize case summaries around background role problem and result"
          git push
