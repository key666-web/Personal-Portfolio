name: Trim GODIVA strategy section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trim-godiva.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify GODIVA case
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<h2>Repair × Localise × Engage</h2>','<h2>修复体验 × 建立本地相关性 × 建立持续关系</h2>')

          s=s.replace('<a href="#g6">06 消费者路径</a><a href="#g7">07 为什么这样做</a><a href="#g8">08 衡量</a>',
                      '<a href="#g6">06 消费者路径</a><a href="#g7">07 衡量</a>')

          start=s.find('<div class="block" id="g7"><div class="s lay"><div class="lab">07 / WHY THIS STRATEGY</div>')
          end=s.find('<div class="block" id="g8">', start)
          if start!=-1 and end!=-1:
              s=s[:start]+s[end:]

          s=s.replace('<div class="block" id="g8"><div class="s lay"><div class="lab">08 / MEASUREMENT</div>',
                      '<div class="block" id="g7"><div class="s lay"><div class="lab">07 / MEASUREMENT</div>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify GODIVA strategy case"
          git push
